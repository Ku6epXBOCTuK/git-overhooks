[package]
name = "git-overhooks"
version = "0.1.0"
edition = "2024"
authors = ["Ku6epXBOCTuK <https://github.com/Ku6epXBOCTuK>"]
description = "Git hooks manager. Use global and local hooks without fear."
license = "MIT"

[[bin]]
name = "goh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["cargo", "derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
dirs = "6.0.0"
dunce = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.8"
toml_edit = "0.25"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
